# Lives on the VPS at /home/ubuntu/docker/apps/trading-bot/ (same pattern as growix).
# CI builds ghcr.io/idk-mr4tyunjay/trading-bot:latest and runs `docker compose pull && up -d` here.
services:
  trading-bot:
    image: ghcr.io/idk-mr4tyunjay/trading-bot:latest
    container_name: trading-bot
    restart: unless-stopped
    env_file: .env
    environment:
      UI_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8090:8090"   # Cloudflare Tunnel -> trading.devtown.lol (gated by Cloudflare Access)
      - "10.10.0.1:8090:8090"   # WireGuard only. Never 0.0.0.0: Docker bypasses UFW and the app has no login.
    volumes:
      - ./config.json:/app/config.json   # writable: the UI saves settings here. Must exist BEFORE first `up`.
      - ./state:/app/state
      - ./logs:/app/logs
    labels:   # Homepage auto-discovery (needs ~/docker/homepage/docker.yaml on the VPS)
      homepage.group: Apps
      homepage.name: Trading Bot
      homepage.icon: mdi-chart-line
      homepage.href: https://trading.devtown.lol
      homepage.description: Hyperliquid bot
      homepage.server: my-docker
      homepage.container: trading-bot
    logging:
      options: {max-size: "10m", max-file: "3"}

  # NSE stocks, paper only: same image, its own config, state/log files (named config.india.*) and dashboard port.
  # No keys needed, so no env_file.
  trading-bot-india:
    image: ghcr.io/idk-mr4tyunjay/trading-bot:latest
    container_name: trading-bot-india
    restart: unless-stopped
    command: ["python", "src/bot.py", "run", "--config", "config.india.json"]
    environment:
      UI_HOST: 0.0.0.0
      UI_PORT: "8091"
    ports:
      - "127.0.0.1:8091:8091"   # Cloudflare Tunnel -> trading-india.devtown.lol (gated by Cloudflare Access)
      - "10.10.0.1:8091:8091"   # WireGuard only. Never 0.0.0.0: Docker bypasses UFW and the app has no login.
    volumes:
      - ./config.india.json:/app/config.india.json   # writable: the UI saves settings here. Must exist BEFORE first `up`.
      - ./state:/app/state
      - ./logs:/app/logs
    labels:
      homepage.group: Apps
      homepage.name: Trading Bot (India)
      homepage.icon: mdi-chart-line
      homepage.href: https://trading-india.devtown.lol
      homepage.description: NSE stocks, paper
      homepage.server: my-docker
      homepage.container: trading-bot-india
    logging:
      options: {max-size: "10m", max-file: "3"}
