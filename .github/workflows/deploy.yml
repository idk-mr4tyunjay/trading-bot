name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-trading-bot
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This bot trades money: never ship a build whose strategy/risk checks fail.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: pip install -r requirements.txt && python tests/test_strategy.py

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trading-bot:latest
            ghcr.io/${{ github.repository_owner }}/trading-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,.env.example,config.json"
          target: "/home/ubuntu/docker/apps/trading-bot/.deploy/"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/docker/apps/trading-bot
            cp .deploy/docker-compose.yml .
            # Seed runtime files once; never overwrite real keys or UI-saved settings.
            if [ ! -f .env ]; then cp .deploy/.env.example .env && chmod 660 .env; fi
            if [ ! -f config.json ]; then cp .deploy/config.json config.json; fi
            docker compose pull
            docker compose up -d
            docker image prune -f
